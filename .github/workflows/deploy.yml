name: Deploy a Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx -y firebase-tools@13 deploy --only hosting --project psicologa-demo-tiforti
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
